name: "Co-Signer Risk Assessment"
description: "AI-powered PR risk assessment and auto-approval"
inputs:
  github-token:
    description: "GitHub App token with PR read/write permissions"
    required: true
  anthropic-api-key:
    description: "Anthropic API key for Claude"
    required: true
  pr-number:
    description: "Pull request number to assess"
    required: true
runs:
  using: "node20"
  main: "dist/index.js"
