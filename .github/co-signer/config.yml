guardrails:
  never_approve_paths:
    - ".github/workflows/**"
    - ".github/CODEOWNERS"
    - "deploy/**"
    - "Dockerfile"
    - ".dockerignore"

  always_low_risk_paths:
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.stories.*"
    - "**/*.md"
    - "src/assets/locales/**"

  never_approve_dependency_paths:
    - "package.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/package-lock.json"

thresholds:
  auto_approve_max_risk: 3
  max_files_changed: 15
  max_lines_changed: 500

claude:
  provider: "anthropic"
  model: "claude-sonnet-4-6"
